/* Public homepage: keep its brand palette independent of saved demo themes. */
.homepage{--green:#315e4d;--purple:#7952b5;--sage:#e4eee5;--pale:#eee5fc;--bg:#fbfaf8;--surface:#fffefd;--ink:#243932;--muted:#55635b;--line:#d5dfd4;--button-ink:#fff;color:var(--ink);background:var(--bg);min-height:100svh;color-scheme:light}
.homepage ::selection{background:var(--pale);color:var(--ink)}
.home-header{padding:0 40px;background:var(--bg)}
.home-nav{max-width:1440px;margin:auto;min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.home-logo{display:flex;align-items:center;flex-shrink:0;border-radius:8px}
.home-logo img{width:182px;height:auto;display:block}
.home-links{display:flex;align-items:center;gap:28px}
.home-link{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 0;background:none;border:0;font-size:13px;font-weight:550;color:var(--ink)}
.home-link:hover,.home-link[aria-expanded=true]{color:var(--purple)}
.home-link[aria-expanded=true]{text-decoration:underline;text-underline-offset:7px}
.home-link .icon{width:13px;height:13px;transition:transform 300ms ease-in-out}
.home-link[aria-expanded=true] .icon{transform:rotate(90deg)}
.home-links .home-login{color:var(--purple);margin-left:18px}
.home-menu{display:none}
.home-panel{height:0;opacity:0;overflow:hidden;visibility:hidden;transition:height 300ms ease-in-out,opacity 300ms ease-in-out,visibility 0s linear 300ms}
.home-panel.is-open{opacity:1;visibility:visible;transition:height 300ms ease-in-out,opacity 300ms ease-in-out,visibility 0s}
.home-panel-inner{max-width:1360px;margin:0 auto;padding:34px 24px 40px;border-top:1px solid var(--line)}
.home-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}
.home-panel h2{font-family:Georgia,serif;font-size:clamp(28px,3vw,38px);font-weight:400;line-height:1.2;letter-spacing:-.025em;text-wrap:balance}
.home-panel p{color:var(--muted);line-height:1.8;max-width:68ch}
.home-panel-head p{margin-top:12px}
.home-close{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:44px;height:44px;flex-shrink:0;display:grid;place-items:center}
.home-about-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px}
.home-about-grid h3{font-size:16px;margin-bottom:12px}
.home-story{font-family:Georgia,serif;font-size:22px;line-height:1.6!important;color:var(--green)!important}
.home-about-grid .home-purpose{margin-top:18px;font-size:13px}
.home-team{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;font-size:13px}
.home-team li{padding-top:12px;border-top:1px solid var(--line)}
.home-team small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.home-guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 36px}
.home-guide article{border-top:1px solid var(--line);padding-top:18px}
.home-guide h3{margin-bottom:8px;font-size:16px;color:var(--green)}
.home-guide p{font-size:13px}
.home-rules{margin-top:26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.home-rules summary{min-height:44px;padding:12px 0;cursor:pointer;font-weight:600;font-size:13px;color:var(--purple)}
.home-rules summary:focus-visible{outline:3px solid var(--purple);outline-offset:4px}
.home-rules ul{padding-left:20px;margin:10px 0 18px;max-width:90ch;color:var(--muted);font-size:13px;line-height:1.8}
.home-storage{font-size:12px;margin-top:22px;max-width:100ch!important}
.homepage .landing{min-height:calc(100svh - 92px);max-width:1520px;margin:auto;padding:0 24px 24px;gap:24px;background:var(--bg)}
body[data-app-theme] .homepage .landing-art{background:var(--surface) url('assets/homepage-background.webp') center/cover}
body[data-app-theme] .homepage .btn:not(.secondary):not(.soft){background:var(--green);color:var(--button-ink);box-shadow:none}
.homepage .landing-art{min-height:calc(100svh - 116px);padding:42px;display:flex;justify-content:center}
.homepage .landing-art:before{display:none}
.homepage .landing-center{margin:auto 0}
.home-emblem{display:block;width:clamp(130px,16vw,200px);height:auto;aspect-ratio:1;object-fit:contain;max-width:100%;margin:0 auto 28px;border-radius:50%;padding:20px;background:var(--surface)}
.homepage .landing-center h2{font-size:clamp(30px,3.1vw,46px);letter-spacing:-.025em}
.homepage .landing-center p,.homepage .art-footer{color:var(--muted)}
.homepage .landing-content{padding:72px 12% 48px}
.homepage .landing-content h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(40px,4.1vw,60px);letter-spacing:-.03em;text-wrap:balance;margin:12px 0 22px}
.homepage .landing-content>p{color:var(--muted);max-width:36ch}
.homepage .landing-content .prototype{position:static;align-self:flex-start;margin-bottom:24px;color:var(--muted);border-color:var(--line);font-size:9px}
.homepage .landing-features{gap:8px 18px;flex-wrap:wrap;margin:0 0 26px;color:var(--muted);font-size:11px}
.homepage .landing-actions .btn{min-height:50px}
.homepage .landing-actions .text-btn{min-height:44px;color:var(--purple)}
.homepage .landing-content .demo-note{color:var(--muted);font-size:11px;margin-top:12px;max-width:none}
.homepage .art-footer{text-align:center;font-size:9px;letter-spacing:1.4px}
@media(min-width:741px) and (max-width:1000px){.home-header{padding:0 24px}.home-links{gap:18px}.home-links .home-login{margin-left:0}.home-logo img{width:148px}.homepage .landing-content{padding:48px 8%}.home-guide{grid-template-columns:1fr 1fr}.home-about-grid{gap:32px}.home-team{grid-template-columns:1fr}}
@media(max-width:740px){.home-header{padding:0 20px}.home-nav{min-height:76px;flex-wrap:wrap;gap:0}.home-logo img{width:151px}.home-menu{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:8px 0 8px 14px;border:0;background:none;color:var(--green);font-size:13px}.home-menu .icon{width:18px}.home-links{display:none;flex-basis:100%;align-items:stretch;gap:4px;padding:4px 0 18px}.home-links.is-open{display:flex;flex-direction:column}.home-links .home-link{justify-content:space-between;padding:10px 4px}.home-links .home-login{margin-left:0}.home-links .btn{margin-top:6px}.home-panel-inner{padding:24px 0 30px}.home-panel-head{gap:14px;margin-bottom:24px}.home-panel h2{font-size:29px}.home-panel-head p{font-size:13px}.home-about-grid{grid-template-columns:1fr;gap:28px}.home-story{font-size:20px}.home-team{gap:16px}.home-guide{grid-template-columns:1fr;gap:22px}.homepage .landing{padding:0 12px 24px;gap:0;min-height:calc(100svh - 76px)}.homepage .landing-art{min-height:240px;height:240px;padding:20px;border-radius:22px}.homepage .landing-center h2{font-size:28px}.homepage .landing-center h2 br{display:block}.home-emblem{width:96px;margin-bottom:14px}.homepage .landing-content{min-height:0;padding:30px 18px 16px}.homepage .landing-content .prototype{margin-bottom:12px;font-size:8px}.homepage .landing-content h1{font-size:40px;line-height:1.1;margin:0 0 16px}.homepage .landing-content>p{font-size:13px;max-width:40ch;margin-bottom:20px}.homepage .landing-features{margin-bottom:20px;font-size:10px;gap:12px}.homepage .landing-content .demo-note{margin-top:8px;font-size:10px}.homepage .landing-actions{margin-top:0;gap:6px}}
@media(prefers-reduced-motion:reduce){.homepage .home-panel,.homepage .home-link .icon,.homepage .btn{transition:none}.homepage .btn:hover{transform:none}}
body.calm .homepage .home-panel,body.calm .homepage .home-link .icon{transition:none}

/* Homepage taste revision: welcome hero and navigation only. */
.homepage{--home-space-1:8px;--home-space-2:16px;--home-space-3:24px;--home-space-4:32px;--home-space-5:48px;--home-space-6:64px;--home-gutter:clamp(24px,4.45vw,64px)}
.homepage .home-nav{width:calc(100vw - 2 * var(--home-gutter));max-width:1312px;min-height:104px;gap:var(--home-space-4)}
.homepage .home-logo img{width:190px;mix-blend-mode:multiply}
.homepage .home-links{gap:var(--home-space-4)}
.homepage .home-link{font-size:14px;transition:color 180ms ease}
.homepage .home-links .home-login{margin-left:var(--home-space-2);color:var(--ink)}
.homepage .home-link:hover,.homepage .home-link[aria-expanded=true]{color:var(--green);text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:2px}
.homepage .home-links .btn{padding:14px 22px;min-height:48px;font-size:14px}
.homepage .home-nav :is(button,a):focus-visible,.homepage .landing-actions button:focus-visible{outline:3px solid var(--green);outline-offset:5px}
.homepage .landing{max-width:1440px;min-height:calc(100svh - 104px);padding:var(--home-space-3) var(--home-gutter) var(--home-space-5);grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:var(--home-space-5);align-items:stretch}
.homepage .landing-content{grid-column:1;grid-row:1;min-height:640px;padding:var(--home-space-5) 0;align-items:flex-start;justify-content:center}
.homepage .landing-content>.eyebrow{order:0;font-size:13px;letter-spacing:0;line-height:1.5;color:var(--green)}
.homepage .landing-content h1{order:1;font-family:Georgia,serif;font-size:clamp(48px,5.3vw,76px);line-height:1.03;font-weight:400;letter-spacing:-.045em;color:var(--ink);margin:var(--home-space-3) 0 var(--home-space-4);text-wrap:initial}
.homepage .landing-content>p:not(.demo-note){order:2;font-size:17px;line-height:1.7;max-width:43ch;margin:0 0 var(--home-space-3);color:var(--ink)}
.homepage .landing-features{order:3;gap:var(--home-space-2) var(--home-space-3);font-size:13px;line-height:1.5;color:var(--green);margin:0 0 var(--home-space-4)}
.homepage .landing-features .icon{color:var(--green);width:16px;height:16px}
.homepage .landing-actions{order:4;align-self:stretch;flex-direction:row;align-items:center;flex-wrap:wrap;gap:var(--home-space-3);margin:0}
.homepage .landing-actions .btn{width:auto;min-width:176px;min-height:54px;font-size:15px;padding:16px 24px}
.homepage .landing-actions .text-btn{font-size:14px;min-height:48px;margin-top:0!important;padding:10px 0;color:var(--green)}
.homepage .landing-actions .text-btn:hover{text-decoration:underline;text-underline-offset:5px}
.homepage .landing-content>.demo-note{order:5;text-align:left;font-size:13px;line-height:1.6;margin:var(--home-space-2) 0 0;color:var(--muted)}

async function changeScreen(next,preference){
 const app=$('#app'),returning=next==='welcome';let rendered=false;
 screenChanging=true;app.inert=true;app.classList.add('screen-changing');app.setAttribute('aria-busy','true');
 const stopMotion=()=>{if(preference.matches||document.body.classList.contains('calm'))screenAnimation?.finish()};
 preference.addEventListener('change',stopMotion);
 const play=async(frames,duration)=>{
  if(preference.matches||document.body.classList.contains('calm'))return;
  screenAnimation=app.animate(frames,{duration,easing:'ease-in-out',fill:'forwards'});
  await screenAnimation.finished.catch(()=>{});
 };
 try{
  await play([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:returning?'translateY(8px)':'translateY(0)'}],225);
  // Replace the screen synchronously while the outgoing animation holds its last frame.
  goNow(next);rendered=true;screenAnimation?.cancel();screenAnimation=null;
  await play([{opacity:0,transform:returning?'translateY(-8px)':'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],300);
 }finally{
  screenAnimation?.cancel();screenAnimation=null;
  preference.removeEventListener('change',stopMotion);
  app.inert=false;app.classList.remove('screen-changing');app.removeAttribute('aria-busy');screenChanging=false;
  if(!rendered)goNow(next);else focusScreenTitle();
 }
}

function bindHomeMotion(root){

 const art=root.querySelector('.landing-art');
 const seen=new WeakSet(),queue=[];
 let active=null,disposed=false;
 const enabled=()=>!preference.matches&&!document.body.classList.contains('calm');
 const next=()=>{

  if(!target){root.classList.remove('home-revealing');return}

  active=target.animate([{opacity:.7,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:650,easing:'ease-out'});
  active.onfinish=()=>{active=null;next()};
 };
 const observer=new IntersectionObserver(entries=>{
  for(const entry of entries){
   if(entry.target===art)continue;
   if(entry.isIntersecting&&!seen.has(entry.target)){
    seen.add(entry.target);if(enabled())queue.push(entry.target);
   }
  }
  next();
 },{threshold:.08});
 observer.observe(art);
 root.querySelectorAll('.landing-content,.home-panel-head,.home-about-grid,.home-guide-card,.home-rules,.home-storage').forEach(el=>{if(!screenChanging||!el.matches('.landing-content'))observer.observe(el)});
 const stop=()=>{if(!enabled()){queue.length=0;if(active){active.cancel();active=null}root.classList.remove('home-revealing')}};

function bindHomepage(){
 const root=$('.homepage');if(!root)return;
 const menu=root.querySelector('.home-menu'),links=root.querySelector('.home-links');
 const toggles=[...root.querySelectorAll('[data-home-panel]')];
 const panelAnimations=new Map(),preference=matchMedia('(prefers-reduced-motion: reduce)');
 const motionAllowed=()=>!preference.matches&&!document.body.classList.contains('calm');
 const settlePanel=(panel,open)=>{
  panel.style.height=open?'auto':'0px';panel.style.opacity=open?'1':'0';
  panel.style.visibility=open?'visible':'hidden';
 };
 const animatePanel=(panel,open)=>{
  // Read the in-flight values before cancellation so rapid reversals stay continuous.
  const height=panel.getBoundingClientRect().height,opacity=getComputedStyle(panel).opacity;
  panelAnimations.get(panel)?.cancel();panelAnimations.delete(panel);
  if(!motionAllowed()){settlePanel(panel,open);return}
  panel.style.height=height+'px';panel.style.opacity=opacity;panel.style.visibility='visible';
  const target=open?panel.firstElementChild.getBoundingClientRect().height:0;
  const animation=panel.animate([{height:height+'px',opacity},{height:target+'px',opacity:open?1:0}],{duration:350,easing:'ease-in-out',fill:'forwards'});
  panelAnimations.set(panel,animation);
  animation.onfinish=()=>{
   if(panelAnimations.get(panel)!==animation)return;
   settlePanel(panel,open);panelAnimations.delete(panel);animation.cancel();
  };
 };
 let current=null;
 links.addEventListener('focusout',()=>{
  if(!links.getClientRects().length&&menu.getClientRects().length)menu.focus({preventScroll:true});
 });
 const restoreToggle=toggle=>{(toggle.getClientRects().length?toggle:menu).focus({preventScroll:true})};
 const setPanel=(id,restoreFocus=false)=>{
  for(const toggle of toggles){
   const panel=root.querySelector('#'+toggle.getAttribute('aria-controls'));
   const open=toggle.dataset.homePanel===id;
   if(!open&&panel.contains(document.activeElement))restoreToggle(toggle);
   panel.inert=!open;panel.setAttribute('aria-hidden',String(!open));
   panel.classList.toggle('is-open',open);toggle.setAttribute('aria-expanded',String(open));

 };
 const setMenu=open=>{if(!open&&menu.getClientRects().length&&links.contains(document.activeElement))menu.focus({preventScroll:true});links.classList.toggle('is-open',open);menu.setAttribute('aria-expanded',String(open))};
 // Listen on the current screen, so navigating away also removes these handlers.
 root.addEventListener('click',e=>{
  const toggle=e.target.closest('[data-home-panel]');
   if(toggle){window.MindRiseSupport?.closePanel(false);setPanel(current===toggle.dataset.homePanel?null:toggle.dataset.homePanel);return}
   if(e.target.closest('[data-support]')){setPanel(null);setMenu(false);window.MindRiseSupport?.show();return}

  if(e.target.closest('[data-home-close]')){setPanel(null,true);return}

  if(!e.target.closest('.home-panel')){setPanel(null);if(!e.target.closest('.home-nav'))setMenu(false)}

 root.addEventListener('keydown',e=>{

 });
 layoutObserver.observe(root);
 const panelContentObserver=new ResizeObserver(entries=>{
  for(const entry of entries){const panel=entry.target.parentElement;if(panelAnimations.has(panel)&&panel.classList.contains('is-open'))animatePanel(panel,true)}
 });
 root.querySelectorAll('.home-panel-inner').forEach(inner=>panelContentObserver.observe(inner));
 const settleReduced=()=>{if(!motionAllowed())for(const [panel,animation] of panelAnimations){animation.cancel();settlePanel(panel,panel.classList.contains('is-open'));panelAnimations.delete(panel)}};
 preference.addEventListener('change',settleReduced);
 bindHomeMotion(root);
 const stopMotion=homeMotionCleanup;
 homeMotionCleanup=()=>{stopMotion();layoutObserver.disconnect();panelContentObserver.disconnect();preference.removeEventListener('change',settleReduced);for(const animation of panelAnimations.values())animation.cancel();panelAnimations.clear()};

}</span><div class="bar" style="height:${s?s.minutes/720*100:0}%"></div><span class="bar-label">${prettyDate(d,{weekday:'short'}).slice(0,1)}</span></div>`}).join(''):Array.from({length:4},(_,i)=>{const days=dates.slice(i*7,i===3?30:(i+1)*7),logs=entries.filter(s=>days.includes(s.date)),v=logs.length?logs.reduce((n,s)=>n+s.minutes,0)/logs.length:0;return `<div class="bar-group"><span class="bar-value">${v?(v/60).toFixed(1)+'h':'—'}</span><div class="bar" style="height:${v/720*100}%"></div><span class="bar-label">Week ${i+1}</span></div>`}).join('')}</div><div class="row between"><span class="small muted">Average sleep</span><span class="metric">${entries.length?hours(avg):'—'}</span></div></section><section class="card"><h2>Recent sleep logs</h2>${[...state.sleep].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).map(s=>`<div class="journal-row row between"><div><strong>${prettyDate(s.date)}</strong><p>${hours(s.minutes)}</p></div><button class="text-btn" data-edit-sleep="${s.date}" aria-label="Edit sleep for ${prettyDate(s.date)}">Edit</button></div>`).join('')||'<p class="small muted spaced">Your first night starts here.</p>'}</section><section class="tip"><div class="row">${icon('leaf')}<h3>A softer end to your day</h3></div><p>Try a simple evening ritual: put your tasks aside, dim the lights, and take a few quiet moments for yourself.</p><button class="text-btn" data-action="wind-down">Add a wind-down task ${icon('plus')}</button></section></div></div>`}

function tasks(){const week=weekDates();return header('A little plan. A lighter mind.','Your classes and tasks, one week at a time.','<div class="planner-actions"><button class="btn secondary" data-add-class>Add class</button><button class="btn" data-action="add-task">'+icon('plus')+' Add task</button></div>')+'<section class="card planner"><div class="planner-toolbar"><h2>'+prettyDate(week[0])+' – '+prettyDate(week[6],{month:'short',day:'numeric',year:'numeric'})+'</h2><div class="planner-actions"><button class="icon-btn" data-week="-1" aria-label="Previous week">'+icon('back')+'</button><button class="text-btn" data-planner-today>Today</button><button class="icon-btn" data-week="1" aria-label="Next week">'+icon('right')+'</button></div><div class="tabs planner-view"><button data-agenda="day" class="'+(taskFilter!=='week'?'active':'')+'" aria-pressed="'+(taskFilter!=='week')+'">Day</button><button data-agenda="week" class="'+(taskFilter==='week'?'active':'')+'" aria-pressed="'+(taskFilter==='week')+'">Week</button></div></div><div class="week-strip" aria-label="Select a day">'+week.map(d=>'<button class="week-date '+(d===dateKey()?'current ':'')+(d===plannerDate?'selected':'')+'" data-busy="'+(state.tasks.some(t=>t.date===d)||classesOn(d).length>0)+'" data-planner-date="'+d+'" aria-pressed="'+(d===plannerDate)+'" aria-label="'+prettyDate(d,{weekday:'long',month:'long',day:'numeric'})+'" '+(d===dateKey()?'aria-current="date"':'')+'>'+prettyDate(d,{weekday:'short'})+'<strong>'+new Date(d+'T12:00:00').getDate()+'</strong><span>'+state.tasks.filter(t=>t.date===d).length+' tasks</span><span>'+classesOn(d).length+' classes</span></button>').join('')+'</div><div class="agenda '+(taskFilter==='week'?'week-agenda':'')+'">'+(taskFilter==='week'?week:[plannerDate]).map(agenda).join('')+'</div></section><section class="card spaced"><div class="row between"><h2>Weekly class schedule</h2><button class="text-btn" data-add-class>Add class</button></div><p class="small muted spaced">Classes repeat every week until you edit or remove them. They are separate from tasks and do not earn completion rewards.</p>'+ (classes().length?classes().map(c=>'<div class="task-row"><div class="task-info"><strong>'+esc(c.subject)+'</strong><p class="small muted">'+c.days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ')+' · '+timeLabel(c.start)+' – '+timeLabel(c.end)+(c.room?' · '+esc(c.room):'')+'</p></div><button class="text-btn" data-edit-class="'+esc(c.id)+'">Edit</button></div>').join(''):'<p class="small muted spaced">Add your first class with its days, times, and optional room.</p>')+'</section>'}
function classDialog(id){const c=classes().find(c=>c.id===id)||{subject:'',days:[new Date(plannerDate+'T12:00:00').getDay()],start:'09:00',end:'10:00',room:''};openDialog(id?'Edit recurring class':'Add a recurring class','Enter your own timetable. Changes apply to every week.', '<form id="class-form" data-id="'+esc(id||'')+'"><label class="field">Subject<input name="subject" required maxlength="90" value="'+esc(c.subject)+'"></label><fieldset class="class-days"><legend>Repeat on</legend>'+[1,2,3,4,5,6,0].map(d=>'<label><input type="checkbox" name="days" value="'+d+'" '+(c.days.includes(d)?'checked':'')+'> '+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]+'</label>').join('')+'</fieldset><div class="form-grid"><label class="field">Start time<input name="start" type="time" required value="'+c.start+'"></label><label class="field">End time<input name="end" type="time" required value="'+c.end+'"></label></div><label class="field">Room / location (optional)<input name="room" maxlength="100" value="'+esc(c.room)+'"></label><p id="class-feedback" class="small spaced" role="status"></p><div class="form-actions">'+(id?'<button type="button" class="text-btn danger" data-remove-class="'+esc(id)+'">Remove class</button>':'')+'<button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn" type="submit">Save class</button></div></form>');classFeedback()}
function classValues(form){const data=new FormData(form);return {id:form.dataset.id,subject:String(data.get('subject')).trim(),days:data.getAll('days').map(Number),start:data.get('start'),end:data.get('end'),room:String(data.get('room')).trim()}}
function classFeedback(){const form=$('#class-form');if(!form)return;const c=classValues(form);$('#class-feedback').textContent=!c.days.length?'Choose at least one weekday.':c.end<=c.start?'End time must be after start time on the same day.':classConflict(c)?'This overlaps another class. You can still save it.':''}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let selector='';if(b.hasAttribute('data-add-class'))classDialog();else if(b.dataset.editClass)classDialog(b.dataset.editClass);else if(b.dataset.removeClass){state.classes=classes().filter(c=>c.id!==b.dataset.removeClass);persist();closeDialog();render();toast('Recurring class removed.')}else if(b.dataset.week){plannerDate=moveDate(plannerDate,Number(b.dataset.week)*7);selector='[data-week="'+b.dataset.week+'"]'}else if(b.hasAttribute('data-planner-today')){plannerDate=dateKey();selector='[data-planner-today]'}else if(b.dataset.plannerDate){plannerDate=b.dataset.plannerDate;taskFilter='day';selector='[data-planner-date="'+plannerDate+'"]'}else if(b.dataset.agenda){taskFilter=b.dataset.agenda;selector='[data-agenda="'+taskFilter+'"]'}else if(b.dataset.editSleep){sleepDialog(b.dataset.editSleep)}if(selector){render();$(selector)?.focus({preventScroll:true})}});
document.addEventListener('input',e=>{if(e.target.closest('#class-form'))classFeedback();if(e.target.closest('#sleep-form'))sleepPreview();if(e.target.closest('#mood-form')){const status=$('#mood-status');if(status)status.textContent='Unsaved changes'}});
document.addEventListener('change',e=>{if(e.target.matches('#sleep-form [name="date"]')){const form=e.target.form,sl=state.sleep.find(s=>s.date===e.target.value);form.elements.bed.value=sl?.bed||'23:00';form.elements.wake.value=sl?.wake||'06:30';sleepPreview()}});
document.addEventListener('submit',e=>{if(e.target.id!=='class-form')return;e.preventDefault();const c=classValues(e.target);if(!c.subject||!c.days.length||!c.start||!c.end||c.end<=c.start){classFeedback();if(!c.subject)$('#class-feedback').textContent='Enter a subject for this class.';return}const all=classes(),existing=all.find(x=>x.id===c.id);if(existing)Object.assign(existing,c);else all.push({...c,id:crypto.randomUUID()});state.classes=all;persist();closeDialog();render();toast('Weekly class schedule saved.')});
function sleepPreview(){const form=$('#sleep-form');if(!form)return;const minutes=duration(form.elements.bed.value,form.elements.wake.value),existing=state.sleep.some(s=>s.date===form.elements.date.value);$('#sleep-preview').textContent=Number.isFinite(minutes)&&minutes?hours(minutes)+' total sleep'+(form.elements.wake.value<form.elements.bed.value?' · Overnight':''):'Choose bedtime and wake-up times.';form.querySelector('[type="submit"]').textContent=existing?'Update sleep log':'Save sleep log'}
function rewards(){const achievements=[['sun','Early Bird','Log a night of sleep.',state.sleep.length>0],['trophy','Focus Pro','Complete 3 tasks today.',todayTasks().filter(t=>t.done).length>=3],['star','Consistency','Check in for 5 days in a row.',streak()>=5]];return `${header('Every small step counts.','Celebrate your progress. Make this space yours.')}<section class="reward-banner"><div><span class="eyebrow">YOUR CURRENT STREAK</span><h2>${streak()} days of showing up.</h2><p class="small muted">Keep your little spark. Log sleep, save a mood, or complete a task.</p></div><div class="streak-symbol">${icon('fire')}</div>${plant()}</section><section class="card spaced"><div class="row between"><h2>Your little milestones</h2><span class="pill lilac">${achievements.filter(a=>a[3]).length} of 3 earned</span></div><div class="achievements">${achievements.map(([ic,title,desc,earned])=>`<div class="achievement ${earned?'':'locked'}"><div class="badge-art">${icon(ic)}</div><h3>${title}</h3><p>${desc}</p><span class="pill ${earned?'lilac':''}">${earned?'✓ Earned':'Keep going'}</span></div>`).join('')}</div></section>${appThemeCard()}`}
function profile(){return `${header('Your own little corner.','Care that fits into your life.')}<div class="profile-grid"><section class="card profile-card">${plant()}<div class="avatar large">${initials()}</div><h2>${esc(state.name)}</h2><p class="muted">${esc(state.school)}</p><span class="pill lilac" style="margin-top:17px">${icon('leaf')} Growing at my own pace</span><button class="btn secondary full" data-action="edit-profile">${icon('edit')} Edit profile</button><p class="small muted" style="margin-top:19px;font-size:10px">Your MindRise presentation profile</p></section><div class="stack"><section class="card"><h2>Make yourself comfortable</h2><div class="setting-row">${icon('bell')}<div><strong>Gentle reminders</strong><p>Show reminders in the notification panel.</p></div><button class="switch" role="switch" aria-checked="${state.notifications}" aria-label="Gentle reminders" data-toggle="notifications"></button></div><div class="setting-row">${icon('leaf')}<div><strong>Calm mode</strong><p>Reduce movement and transitions.</p></div><button class="switch" role="switch" aria-checked="${state.calm}" aria-label="Calm mode" data-toggle="calm"></button></div><button class="setting-row settings-button" data-action="app-themes">${icon('settings')}<div><strong>App theme</strong><p>${esc((appThemeCatalog.find(t=>t.id===state.theme)||appThemeCatalog[0]).name)}</p></div>${icon('arrow')}</button><button class="setting-row settings-button" data-action="help">${icon('help')}<div><strong>Help & demo guide</strong><p>A quick walk through MindRise.</p></div>${icon('arrow')}</button></section>${appThemeCard()}<section class="card"><h3>Your demo space</h3><p class="small muted" style="margin-top:8px">${storageOK?'Your changes are saved on this browser.':'Browser storage is unavailable; changes last for this session.'} This prototype uses sample history and has no real accounts or device tracking.</p><button class="setting-row settings-button" data-action="reset">${icon('reset')}<div><strong>Reset presentation</strong><p>Restore the sample tasks, logs, and profile.</p></div>${icon('arrow')}</button><button class="setting-row settings-button" data-action="logout">${icon('logout')}<div><strong>Log out of demo</strong><p>Return to the welcome screen.</p></div>${icon('arrow')}</button></section></div></div>`}
function openDialog(title,sub,content){previousFocus=document.activeElement;const d=$('#dialog');d.innerHTML=`<div class="dialog-head"><div><h2 id="dialog-title">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn" data-action="close" aria-label="Close dialog">${icon('close')}</button></div>${content}`;d.showModal()}
function closeDialog(){const d=$('#dialog');if(d.open)d.close()}
$('#dialog').addEventListener('close',()=>{if(previousFocus?.isConnected)previousFocus.focus()});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
function taskDialog(id,template){const t=state.tasks.find(t=>t.id===id)||{title:template?'Wind down for bed':'',time:template?'21:30':'12:00',date:page==='tasks'?plannerDate:dateKey(),category:template?'Wellness':'Academic'};openDialog(id?'A little change to your plan':'Make room for something good','Keep it simple. One step is enough.',`<form id="task-form" data-id="${esc(id||'')}"><label class="field">Task name<input name="title" required maxlength="90" value="${esc(t.title)}" placeholder="What would you like to do?"></label><div class="form-grid"><label class="field">Date<input name="date" type="date" required value="${t.date}"></label><label class="field">Time<input name="time" type="time" required value="${t.time}"></label></div><label class="field">A little category<select name="category">${['Academic','Wellness','Personal'].map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}</select></label><div class="form-actions">${id?`<button type="button" class="text-btn danger" data-delete-task="${esc(id)}" style="margin-right:auto">Delete task</button>`:''}<button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn" type="submit">${id?'Save changes':'Add task'}</button></div></form>`)}
function sleepDialog(selected=dateKey()){const sl=state.sleep.find(s=>s.date===selected);openDialog('How was your night?','Log your main sleep. Use the date you woke up.',`<form id="sleep-form"><label class="field">Wake-up date<input name="date" type="date" required value="${selected}" max="${dateKey()}"></label><div class="form-grid"><label class="field">Bedtime<input name="bed" type="time" required value="${sl?.bed||'23:00'}"></label><label class="field">Wake up<input name="wake" type="time" required value="${sl?.wake||'06:30'}"></label></div><p class="small muted">An earlier wake-up time means you slept overnight. Saving replaces the log for this date.</p><p id="sleep-preview" class="small spaced" role="status"></p><p id="sleep-error" class="form-error spaced" role="alert"></p><button class="btn full spaced" type="submit">Save sleep log</button></form>`);sleepPreview()}
function notifications(){const remaining=todayTasks().filter(t=>!t.done);openDialog('A gentle nudge','Little reminders for your day.',!state.notifications?'<p class="small muted">Reminders are turned off. You can enable them in your profile.</p>':`${remaining.length?remaining.slice(0,3).map(t=>`<div class="journal-row">${icon('clock')}<div><strong>${esc(t.title)}</strong><p>${timeLabel(t.time)} · On your plan for today</p></div></div>`).join(''):'<p class="small muted">Your tasks are all done. Take a moment to enjoy it.</p>'}<button class="btn full spaced" data-action="open-tasks">See my tasks</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.editTask){taskDialog(b.dataset.editTask);return}if(b.dataset.deleteTask){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.deleteTask);persist();closeDialog();render();toast('Task removed. A little more breathing room.');return}if(b.dataset.filter){taskFilter=b.dataset.filter;render();return}if(b.dataset.range){sleepRange=b.dataset.range;render();return}if(b.dataset.mood!==undefined){moodChoice=Number(b.dataset.mood);$('#mood-status').textContent='Unsaved changes';document.querySelectorAll('[data-mood]').forEach(el=>{el.classList.toggle('active',Number(el.dataset.mood)===moodChoice);el.setAttribute('aria-pressed',Number(el.dataset.mood)===moodChoice)});return}if(b.dataset.energy){energyChoice=Number(b.dataset.energy);$('#mood-status').textContent='Unsaved changes';document.querySelectorAll('[data-energy]').forEach(el=>{el.classList.toggle('active',Number(el.dataset.energy)<=energyChoice);el.setAttribute('aria-pressed',Number(el.dataset.energy)===energyChoice)});$('#energy-value').textContent=energyChoice+' / 5';return}if(b.dataset.theme){selectAppTheme(b.dataset.theme);return}if(b.dataset.toggle){const prop=b.dataset.toggle;state[prop]=!state[prop];persist();applyTheme();b.setAttribute('aria-checked',state[prop]);toast(prop==='calm'?(state.calm?'Calm mode on.':'Calm mode off.'):(state.notifications?'Gentle reminders on.':'Gentle reminders off.'));return}switch(b.dataset.action){case'start':authMode='signup';go('auth');break;case'login':authMode='login';go('auth');break;case'demo':go('home');break;case'add-task':taskDialog();break;case'wind-down':taskDialog(null,true);break;case'close':closeDialog();break;case'log-sleep':sleepDialog();break;case'notifications':notifications();break;case'open-tasks':closeDialog();go('tasks');break;case'edit-profile':openDialog('Make this space yours','A few little details about you.',`<form id="profile-form"><label class="field">Your name<input name="name" required maxlength="40" value="${esc(state.name)}"></label><label class="field">School or community<input name="school" required maxlength="60" value="${esc(state.school)}"></label><label class="field">Email <span class="muted small">Optional · demo only</span><input name="email" type="email" maxlength="100" value="${esc(state.email)}"></label><button class="btn full" type="submit">Save profile</button></form>`);break;case'app-themes':openDialog('Your app, your colors','App themes do not change garden backdrops.',appThemeCard());break;case'help':openDialog('Welcome to MindRise','A simple flow for your presentation.',`<div class="help-step"><b>1</b><div><strong>Check your day</strong>Home brings sleep, mood, energy, and tasks into one space.</div></div><div class="help-step"><b>2</b><div><strong>Notice how you’re doing</strong>Open Track to log sleep and save a mood and energy check-in.</div></div><div class="help-step"><b>3</b><div><strong>Make a little progress</strong>Add or complete tasks, earn milestones, and choose a theme.</div></div><p class="small muted">This is a presentation prototype. History is sample data; there is no real account, health integration, or push notification service. Changes are stored only in this browser where supported.</p><button class="btn full spaced" data-action="close">Got it</button>`);break;case'reset':openDialog('A fresh start for the demo?','This clears your edits and restores the sample data.',`<div class="form-actions"><button class="btn secondary" data-action="close">Keep my changes</button><button class="btn" data-action="confirm-reset">Reset demo</button></div>`);break;case'confirm-reset':state=seed();gardenTab='garden';gardenCelebration=false;persist();taskFilter='today';plannerDate=dateKey();wellnessMessage='';sleepRange='week';closeDialog();go('welcome');toast('Your presentation is ready for a fresh start.');break;case'logout':go('welcome');toast('See you soon. Your demo progress is saved.');break}});
document.addEventListener('change',e=>{if(e.target.dataset.task){const t=state.tasks.find(t=>t.id===e.target.dataset.task);if(!t)return;t.done=e.target.checked;let gardenMessage='';if(t.done){activity();if(t.date===dateKey())gardenMessage=gardenReward('task',t.id)}persist();const taskId=t.id;const shouldCelebrate=t.done&&todayTasks().every(t=>t.done);render();const replacement=document.querySelector(`[data-task="${CSS.escape(taskId)}"]`);replacement?.focus({preventScroll:true});if(shouldCelebrate)toast('All of today’s tasks complete. You’ve earned a pause.'+gardenMessage);else if(gardenMessage)toast(gardenMessage.trim())}});
document.addEventListener('submit',e=>{const form=e.target;if(!['auth-form','task-form','sleep-form','mood-form','profile-form'].includes(form.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(form));if(form.id==='auth-form'){if(authMode==='signup'){const name=data.name.trim();if(!name){toast('Add a name to make this space yours.');return}state.name=name}state.email=data.email.trim();persist();go('home');toast('Welcome to your little wellness space.')}if(form.id==='task-form'){const title=data.title.trim();if(!title){toast('Give your task a short name.');return}const existing=state.tasks.find(t=>t.id===form.dataset.id);if(existing)Object.assign(existing,{title,time:data.time,date:data.date,category:data.category});else state.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,time:data.time,date:data.date,category:data.category,done:false});persist();closeDialog();render();toast(existing?'Your plan has been updated.':'A little step added to your plan.')}if(form.id==='sleep-form'){const mins=duration(data.bed,data.wake);if(!mins){$('#sleep-error').textContent='Choose different bedtime and wake-up times.';return}if(data.date>dateKey()){$('#sleep-error').textContent='Choose today or an earlier date.';return}state.sleep=state.sleep.filter(s=>s.date!==data.date);state.sleep.push({date:data.date,bed:data.bed,wake:data.wake,minutes:mins});activity();const gardenMessage=gardenReward('sleep',data.date);wellnessMessage='sleep';persist();closeDialog();render();toast(`${hours(mins)} of rest logged. Be kind to yourself today.${gardenMessage}`)}if(form.id==='mood-form'){state.moods=state.moods.filter(m=>m.date!==dateKey());state.moods.push({date:dateKey(),mood:moodChoice,energy:energyChoice,note:data.note.trim()});activity();wellnessMessage='mood';persist();render();toast('Check-in saved. Thanks for showing up for yourself.')}if(form.id==='profile-form'){if(!data.name.trim()||!data.school.trim()){toast('Please enter your name and school or community.');return}state.name=data.name.trim();state.school=data.school.trim();state.email=data.email.trim();persist();closeDialog();render();toast('Your space feels a little more like you.')}});

function appThemeCard(){const g=ensureGarden();return `<section class="card spaced"><div class="row between"><div><h2>A space that feels like you</h2><p class="small muted" style="margin-top:5px">App colors, from your sidebar to your daily check-in. Garden backdrops are chosen separately.</p></div>${icon('leaf')}</div><p class="small muted spaced">✦ ${g.gems} Mind Gems · Purchased themes stay unlocked.</p><div class="themes app-theme-grid">${appThemeCatalog.map(t=>{const owned=!t.price||g.owned.appThemes.includes(t.id),active=state.theme===t.id;return `<button class="theme-btn ${active?'active':''}" data-theme="${t.id}" aria-pressed="${active}" aria-label="${t.name}${owned?'':', unlock for '+t.price+' Mind Gems'}" ${!owned&&g.gems<t.price?'disabled':''} style="--preview-bg:${t.colors[9]};--preview-surface:${t.colors[5]};--preview-accent:${t.colors[1]}"><div class="theme-preview"><span class="theme-mini" aria-hidden="true"><i></i><i></i></span><span class="theme-swatches" aria-hidden="true"><i></i><i></i></span></div><span class="theme-label">${t.name}${active?icon('check'):''}</span><span class="theme-price">${active?'Selected':owned?(t.price?'Use theme':'Free · Use theme'):g.gems<t.price?t.price+' Gems · need '+(t.price-g.gems)+' more':'Unlock · '+t.price+' Gems'}</span></button>`}).join('')}</div></section>`}
function selectAppTheme(id){const t=appThemeCatalog.find(t=>t.id===id);if(!t)return;const g=ensureGarden();if(t.price&&!g.owned.appThemes.includes(id)){if(g.gems<t.price){toast('A few more Mind Gems will unlock this app theme.');return}g.gems-=t.price;g.owned.appThemes.push(id)}state.theme=id;persist();closeDialog();render();toast(t.name+' brings a fresh feel to your space.')}
function gardenTarget(target){const g=ensureGarden();return target==='active'?g.active:/^(0|[1-9]\d*)$/.test(target)?g.showcase[Number(target)]:null}

function gardenCelebrate(){if(!gardenCelebration)return;const g=ensureGarden(),p=g.showcase[g.showcase.length-1];gardenCelebration=false;if(!p)return;openDialog('Max Level. A little milestone!','Seven active days of care, now yours to keep.',`<div class="garden-stage garden-celebrate">${gardenArt(p.seed,7,p.pot,p.background,p.tag)}</div><p class="small muted spaced">${esc(gardenItem('seeds',p.seed).name)} is saved permanently in your Garden with ${p.xp} XP. You can plant another owned seed in My Garden.</p><button class="btn full spaced" data-action="close">Keep growing ${icon('leaf')}</button>`)}
function gardenHome(){const g=ensureGarden(),p=g.active,shown=p||(gardenCelebration?g.showcase[g.showcase.length-1]:null);return `<section class="card garden-home"><div class="garden-stage ${gardenCelebration?'garden-celebrate':''}">${gardenArt(shown?.seed||'succulent',shown?.days.length||0,shown?.pot||g.selected.pots,shown?.background||g.selected.backgrounds,shown?.tag||g.selected.tags)}</div><div><span class="eyebrow">MY GARDEN</span><h3>${p?esc(gardenItem('seeds',p.seed).name):gardenCelebration?'Max Level! Added to your Garden.':'A little space to grow.'}</h3><p class="small muted">${p?p.days.length+' / 7 active days':'Plant a seed to begin.'} · ${g.gems} Mind Gems</p><div class="progress"><i style="width:${p?p.days.length/7*100:0}%"></i></div></div><button class="btn secondary small" data-go="garden">Visit my garden ${icon('leaf')}</button></section>`}
function garden(){const g=ensureGarden();return `${header('Your little world of growth.','Small acts of care. Something beautiful to keep.')}<div class="garden-wallet"><span class="pill lilac">✦ ${g.gems} Mind Gems</span><span class="pill">${g.xp} total XP</span><span class="pill">${gardenMultiplier()}× streak bonus · ${streak()} days</span></div><div class="tabs garden-tabs" role="group" aria-label="Garden sections">${[['garden','Nursery'],['showcase','Garden'],['shop','Shop']].map(([id,label])=>`<button data-garden-tab="${id}" class="${gardenTab===id?'active':''}" aria-pressed="${gardenTab===id}">${label}</button>`).join('')}</div><p class="garden-subtitle muted">${{garden:'Nurture your current habit',showcase:'Your living portfolio',shop:'Seeds, pots, & environment themes'}[gardenTab]}</p>${gardenTab==='shop'?gardenShop():gardenTab==='showcase'?gardenShowcase():gardenGrowing()}`}
function gardenGrowing(){const g=ensureGarden(),p=g.active,shown=p||(gardenCelebration?g.showcase[g.showcase.length-1]:null);return `${gardenCelebration?'<div class="garden-message" role="status">✦ Max Level! Your plant has a permanent home in the Garden.</div>':''}<div class="garden-layout"><section class="card"><div class="garden-stage ${gardenCelebration?'garden-celebrate':''}">${gardenArt(shown?.seed||'succulent',shown?.days.length||0,shown?.pot||g.selected.pots,shown?.background||g.selected.backgrounds,shown?.tag||g.selected.tags)}</div><div class="row between spaced"><h2>${shown?esc(gardenItem('seeds',shown.seed).name):'Your next little beginning'}</h2><span class="pill lilac">${shown?Math.round(shown.days.length/7*100):0}% grown</span></div><div class="progress spaced"><i style="width:${shown?shown.days.length/7*100:0}%"></i></div><p class="small muted spaced">${p?p.days.length+' / 7 active days · '+p.xp+' plant XP':shown?'Max Level · '+shown.xp+' plant XP · Saved in your Garden. Plant another seed below.':'Choose an owned seed below to start growing.'}</p>${p?'<div class="garden-controls"><button class="btn secondary" data-garden-customize="active">Customize plant</button><button class="btn secondary" data-garden-share="active">Share Plant</button></div>':''}</section><div class="stack"><section class="tip"><h3>A little care, every day.</h3><p>A newly rewarded sleep log or today’s task grows your active plant once per day. Seven active days bring it to Max Level; missed days don’t reset growth. Plant XP accumulates separately.</p><p>Sleep: 50 Mind Gems + 50 XP. Daily task: 20 Mind Gems + 20 XP. Streak bonus: 1× on days 1–2, 1.25× on days 3–6, and 1.5× from day 7. Rewards round to the nearest whole number.</p><p>Each sleep date and task earns once. Existing history earns no retroactive rewards. Plant before completing your next rewarded action.</p></section><section class="card"><h3>Your seeds</h3>${gardenCatalog.seeds.map(s=>`<div class="setting-row"><div><strong>${esc(s.name)}</strong><p>${g.seeds[s.id]} owned · ${s.rarity}</p></div><button class="btn small secondary" data-garden-plant="${s.id}" ${p||!g.seeds[s.id]?'disabled':''}>Plant</button></div>`).join('')}<button class="text-btn" data-garden-tab="shop">Visit the shop ${icon('right')}</button></section></div></div>`}
function gardenShop(){const g=ensureGarden();return `<p class="small muted">Seeds are used when planted. Pots, tags, and backgrounds are yours to keep. Shop selections apply to your Nursery plant. Choose your shared Garden backdrop in the Garden tab.</p>${[['seeds','Seeds & varieties'],['pots','Pots & planters'],['tags','Milestone tags'],['backgrounds','Garden environments']].map(([group,title])=>`<h2 class="garden-section">${title}</h2><div class="garden-grid">${gardenCatalog[group].map(item=>{const owned=group!=='seeds'&&g.owned[group].includes(item.id),selected=owned&&g.selected[group]===item.id,seed=group==='seeds'?item.id:g.active?.seed||'bonsai';return `<section class="card garden-item"><div class="garden-stage">${gardenArt(seed,7,group==='pots'?item.id:g.selected.pots,group==='backgrounds'?item.id:g.selected.backgrounds,group==='tags'?item.id:g.selected.tags)}</div>${item.rarity?`<span class="garden-rarity">${item.rarity}</span>`:''}<h3>${esc(item.name)}</h3><p>${group==='seeds'?g.seeds[item.id]+' owned · ':''}${owned?'Permanently unlocked':item.price+' Mind Gems'}</p><button class="btn ${owned?'secondary':''} small" data-garden-buy="${group}:${item.id}" ${selected||(!owned&&g.gems<item.price)?'disabled':''}>${selected?'Selected':owned?'Use':g.gems<item.price?'Need '+(item.price-g.gems)+' more Gems':'Buy · '+item.price+' Gems'}</button></section>`}).join('')}</div>`).join('')}`}
function gardenShowcase(){const g=ensureGarden(),scene=gardenScene();return '<section class="card garden-portfolio"><div class="garden-scene-toolbar"><label class="field">Garden backdrop<select id="garden-scene-background" aria-label="Shared garden backdrop">'+gardenCatalog.backgrounds.map(item=>'<option value="'+item.id+'" '+(g.sceneBackground===item.id?'selected':'')+' '+(g.owned.backgrounds.includes(item.id)?'':'disabled')+'>'+esc(item.name)+(g.owned.backgrounds.includes(item.id)?'':' · Locked · '+item.price+' Gems')+'</option>').join('')+'</select></label><button class="btn" data-garden-export="all">'+icon('leaf')+' Share Garden</button></div><p class="small muted" style="margin-bottom:16px">One shared space for your mature plants. This backdrop is independent of your Nursery.</p><div class="garden-canvas-scroll" tabindex="0" role="region" aria-label="Garden shelves; scroll horizontally on smaller screens"><div class="garden-canvas">'+scene.svg+'</div></div>'+(g.showcase.length?'':'<p class="small muted spaced">Your first seven active days will bring a plant home. These little spaces are waiting for you.</p><button class="text-btn" data-garden-tab="garden">Visit the Nursery '+icon('right')+'</button>')+'</section>'+(g.showcase.length?'<details class="card spaced garden-plant-list"><summary>Care for your collection · '+g.showcase.length+' plants</summary><p class="small muted spaced">Personalize each pot and tag. Individual plant cards keep their own backdrop; the shared garden uses the setting above.</p>'+g.showcase.map((p,i)=>'<div class="setting-row"><div><strong>'+esc(gardenItem('seeds',p.seed).name)+'</strong><p>'+prettyDate(p.harvested)+' · '+p.xp+' XP</p></div><button class="btn small secondary" data-garden-customize="'+i+'">Customize<span class="hidden"> '+esc(gardenItem('seeds',p.seed).name)+'</span></button></div>').join('')+'</details>':'')}
async function gardenShare(target){const g=ensureGarden(),p=target==='active'?g.active:g.showcase[Number(target)];if(!p){toast('Plant a seed before sharing.');return}const active=target==='active',pot=active?g.selected.pots:p.pot,bg=active?g.selected.backgrounds:p.background,tag=active?g.selected.tags:p.tag,days=p.days.length,streakDays=active?streak():p.streak;let imageURL;
 try{const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas unavailable');const img=new Image();imageURL=URL.createObjectURL(new Blob([gardenArt(p.seed,days,pot,bg,tag)],{type:'image/svg+xml'}));await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=imageURL});ctx.fillStyle='#f8f7fa';ctx.fillRect(0,0,1080,1350);ctx.textAlign='center';ctx.fillStyle='#315e4d';ctx.font='bold 48px Arial';ctx.fillText('MindRise · My Garden',540,105);ctx.drawImage(img,120,160,840,840);ctx.font='bold 48px Arial';ctx.fillText(gardenItem('seeds',p.seed).name,540,1080);ctx.font='30px Arial';ctx.fillStyle='#747b78';ctx.fillText(`${days>=7?'Max Level':days+' / 7 active days'} · ${p.xp} XP`,540,1140);ctx.fillText(`${streakDays}-day ${active?'current':'harvest'} streak`,540,1195);ctx.font='26px Arial';ctx.fillText('Small steps. Brighter days.',540,1280);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('Image unavailable');const file=new File([blob],'mindrise-plant.png',{type:'image/png'}),url=URL.createObjectURL(blob);openDialog('Your little growth story','A portrait card to download or share.',`<img src="${url}" alt="Share card for ${esc(gardenItem('seeds',p.seed).name)}" style="display:block;width:100%;border-radius:14px"><div class="garden-controls"><a class="btn" href="${url}" download="mindrise-plant.png">Download PNG</a>${navigator.canShare?.({files:[file]})?'<button class="btn secondary" id="garden-native-share">Share Plant</button>':''}</div>`);$('#dialog').addEventListener('close',()=>URL.revokeObjectURL(url),{once:true});$('#garden-native-share')?.addEventListener('click',async()=>{try{await navigator.share({files:[file],title:'My MindRise plant'})}catch(error){if(error.name!=='AbortError')toast('Sharing is unavailable. Use Download PNG instead.')}})}catch(error){toast('The share card could not be created. Please try again.')}finally{if(imageURL)URL.revokeObjectURL(imageURL)}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.gardenTab){gardenTab=b.dataset.gardenTab;gardenCelebration=false;render();return}if(b.dataset.gardenExport==='all'){gardenShareAll();return}if(b.dataset.gardenCustomize!==undefined){gardenCustomizer(b.dataset.gardenCustomize);return}if(b.dataset.gardenShare!==undefined){gardenShare(b.dataset.gardenShare);return}if(b.dataset.gardenPlant){const g=ensureGarden(),id=b.dataset.gardenPlant;if(g.active||!gardenItem('seeds',id)||!g.seeds[id])return;g.seeds[id]--;g.active={seed:id,days:[],xp:0,planted:dateKey()};gardenCelebration=false;persist();render();toast('A little beginning. Your next rewarded action helps it grow.');return}if(b.dataset.gardenBuy){const [group,id]=b.dataset.gardenBuy.split(':'),item=gardenCatalog[group]?.find(i=>i.id===id);if(!item)return;const g=ensureGarden(),owned=group!=='seeds'&&g.owned[group].includes(id);if(!owned){if(g.gems<item.price){toast('A few more Mind Gems will get you there.');return}g.gems-=item.price;if(group==='seeds')g.seeds[id]++;else g.owned[group].push(id)}if(group!=='seeds')g.selected[group]=id;persist();render();toast(owned?'Your garden has a fresh look.':item.name+' added to your collection.')}});
document.addEventListener('change',e=>{if(e.target.id!=='garden-scene-background')return;const g=ensureGarden(),id=e.target.value;if(!gardenCatalog.backgrounds.some(item=>item.id===id)||!g.owned.backgrounds.includes(id)){e.target.value=g.sceneBackground;toast('Unlock this backdrop in the Shop first.');return}g.sceneBackground=id;persist();render();$('#garden-scene-background')?.focus();toast('Your Garden has a fresh atmosphere. Nursery unchanged.')});
async function gardenShareAll(){let imageURL;try{const scene=gardenScene(),scale=Math.min(1.5,16000/scene.height,Math.sqrt(24000000/(scene.width*scene.height))),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(scene.width*scale));canvas.height=Math.max(1,Math.round(scene.height*scale));const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas unavailable');imageURL=URL.createObjectURL(new Blob([scene.svg],{type:'image/svg+xml'}));const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=imageURL});ctx.drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('Image unavailable');const file=new File([blob],'mindrise-garden.png',{type:'image/png'}),url=URL.createObjectURL(blob);openDialog('Your living portfolio','Every mature plant, your chosen Garden backdrop, and your current streak.',`<img src="${url}" alt="Full MindRise garden share card" style="display:block;width:100%;border-radius:14px"><div class="garden-controls"><a class="btn" href="${url}" download="mindrise-garden.png">Download PNG</a>${navigator.canShare?.({files:[file]})?'<button class="btn secondary" id="garden-full-native-share">Share Garden</button>':''}</div>`);$('#dialog').addEventListener('close',()=>URL.revokeObjectURL(url),{once:true});$('#garden-full-native-share')?.addEventListener('click',async()=>{try{await navigator.share({files:[file],title:'My MindRise garden'})}catch(error){if(error.name!=='AbortError')toast('Sharing is unavailable. Use Download PNG instead.')}})}catch(error){toast('The garden card could not be created. Please try again.')}finally{if(imageURL)URL.revokeObjectURL(imageURL)}}
ensureGarden();
render();
</script>
<script src="support-chat.js"></script>
